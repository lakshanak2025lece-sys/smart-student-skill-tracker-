<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Student Skill Tracker</title>
  <meta name="description" content="Track your technical skills, courses, certifications, projects and learning progress. Identify skill gaps and prepare for your dream career." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!-- App Styles -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════
       SIDEBAR
  ═══════════════════════════════════════════ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">
          <i class="fas fa-graduation-cap"></i>
        </div>
        <div class="logo-text">
          <span class="logo-title">SkillTrack</span>
          <span class="logo-sub">Student Edition</span>
        </div>
      </div>
      <button class="sidebar-close" id="sidebarClose"><i class="fas fa-times"></i></button>
    </div>

    <nav class="sidebar-nav">
      <ul>
        <li>
          <a href="#" class="nav-link active" data-page="dashboard" id="nav-dashboard">
            <span class="nav-icon"><i class="fas fa-chart-pie"></i></span>
            <span class="nav-label">Dashboard</span>
            <span class="nav-badge" id="badge-dashboard"></span>
          </a>
        </li>
        <li>
          <a href="#" class="nav-link" data-page="skills" id="nav-skills">
            <span class="nav-icon"><i class="fas fa-brain"></i></span>
            <span class="nav-label">Skills</span>
            <span class="nav-badge" id="badge-skills"></span>
          </a>
        </li>
        <li>
          <a href="#" class="nav-link" data-page="courses" id="nav-courses">
            <span class="nav-icon"><i class="fas fa-book-open"></i></span>
            <span class="nav-label">Courses &amp; Certs</span>
            <span class="nav-badge" id="badge-courses"></span>
          </a>
        </li>
        <li>
          <a href="#" class="nav-link" data-page="projects" id="nav-projects">
            <span class="nav-icon"><i class="fas fa-code-branch"></i></span>
            <span class="nav-label">Projects</span>
            <span class="nav-badge" id="badge-projects"></span>
          </a>
        </li>
        <li>
          <a href="#" class="nav-link" data-page="goals" id="nav-goals">
            <span class="nav-icon"><i class="fas fa-bullseye"></i></span>
            <span class="nav-label">Goals</span>
            <span class="nav-badge" id="badge-goals"></span>
          </a>
        </li>
        <li>
          <a href="#" class="nav-link" data-page="analyzer" id="nav-analyzer">
            <span class="nav-icon"><i class="fas fa-magnifying-glass-chart"></i></span>
            <span class="nav-label">Skill Gap Analyzer</span>
            <span class="nav-badge" id="badge-analyzer"></span>
          </a>
        </li>
      </ul>
    </nav>

    <div class="sidebar-footer">
      <div class="student-profile" id="studentProfile">
        <div class="profile-avatar" id="profileAvatar">S</div>
        <div class="profile-info">
          <span class="profile-name" id="profileName">Student</span>
          <span class="profile-role" id="profileRole">CS Undergraduate</span>
        </div>
        <button class="profile-edit-btn" id="profileEditBtn" title="Edit Profile">
          <i class="fas fa-pen"></i>
        </button>
      </div>
    </div>
  </aside>

  <!-- ═══════════════════════════════════════════
       MAIN LAYOUT
  ═══════════════════════════════════════════ -->
  <div class="layout" id="layout">

    <!-- Top Bar -->
    <header class="topbar">
      <button class="hamburger" id="hamburger">
        <i class="fas fa-bars"></i>
      </button>
      <div class="topbar-title" id="topbarTitle">Dashboard</div>
      <div class="topbar-actions">
        <div class="search-wrap">
          <i class="fas fa-search search-icon"></i>
          <input type="text" id="globalSearch" class="search-input" placeholder="Search skills, courses…" />
        </div>
        <button class="topbar-btn notification-btn" id="notificationBtn" title="Notifications">
          <i class="fas fa-bell"></i>
          <span class="notif-dot"></span>
        </button>
      </div>
    </header>

    <!-- Page Content -->
    <main class="main-content" id="mainContent">
      <!-- Pages are injected here by JS -->
      <div class="page-loader" id="pageLoader">
        <div class="loader-spinner"></div>
      </div>
    </main>
  </div>

  <!-- Sidebar Overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ═══════════════════════════════════════════
       GLOBAL MODAL
  ═══════════════════════════════════════════ -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">Modal</h3>
        <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter">
        <button class="btn btn-ghost" id="modalCancel">Cancel</button>
        <button class="btn btn-primary" id="modalConfirm">Save</button>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       TOAST CONTAINER
  ═══════════════════════════════════════════ -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ═══════════════════════════════════════════
       PROFILE MODAL
  ═══════════════════════════════════════════ -->
  <div class="modal-backdrop" id="profileModalBackdrop">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Edit Profile</h3>
        <button class="modal-close" id="profileModalClose"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body">
        <form id="profileForm" class="form-grid">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" id="pf-name" class="form-input" placeholder="Your full name" />
          </div>
          <div class="form-group">
            <label class="form-label">Role / Course</label>
            <input type="text" id="pf-role" class="form-input" placeholder="e.g. CS Undergraduate, MCA Student" />
          </div>
          <div class="form-group">
            <label class="form-label">Institution</label>
            <input type="text" id="pf-institution" class="form-input" placeholder="Your college / university" />
          </div>
          <div class="form-group">
            <label class="form-label">Target Role</label>
            <select id="pf-target" class="form-select">
              <option value="">Select target job role…</option>
              <option value="frontend">Frontend Developer</option>
              <option value="backend">Backend Developer</option>
              <option value="fullstack">Full Stack Developer</option>
              <option value="data-scientist">Data Scientist</option>
              <option value="ml-engineer">ML Engineer</option>
              <option value="devops">DevOps Engineer</option>
              <option value="mobile">Mobile Developer</option>
              <option value="cybersecurity">Cybersecurity Analyst</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="profileModalCancel">Cancel</button>
        <button class="btn btn-primary" id="profileModalSave">Save Profile</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/skills.js"></script>
  <script src="js/courses.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/goals.js"></script>
  <script src="js/analyzer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
